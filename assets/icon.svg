<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243154"/>
      <stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E9BFF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#2C313B" stroke-width="3"/>

  <!-- power symbol -->
  <g fill="none" stroke="url(#glyph)" stroke-width="18" stroke-linecap="round">
    <!-- arc -->
    <path d="M 84 96 A 60 60 0 1 0 172 96"/>
    <!-- vertical bar -->
    <line x1="128" y1="64" x2="128" y2="132"/>
  </g>
</svg>
